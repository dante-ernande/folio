name: Build and Pack Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-pack:
    name: Pack for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_extension: "exe" 
          - os: macos-13 
            artifact_extension: "dmg"
          - os: ubuntu-latest
            artifact_extension: "AppImage"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Linux Dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev libsoup2.4-dev libfuse2

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-packager
      run: cargo install cargo-packager --locked

    - name: Build Binary
      run: cargo build --release

    - name: Build and Package
      run: cargo packager --release

    - name: Upload Installer Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: folio-${{ matrix.os }}
        path: target/release/packager/*/**/*.${{ matrix.artifact_extension }}

  release:
    name: Create GitHub Release
    needs: build-and-pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download All Artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Move artifacts to root
      run: |
        find artifacts/ -type f -exec cp {} . \;
        ls -la

    - name: Publish Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          *.dmg
          *.AppImage
          *.exe
        body: "Release oficial contendo instaladores nativos DMG (Mac Intel), AppImage (Linux) e instalador Windows."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
