name: Build and Release Multiplatform Binaries

on:
  push:
    tags:
      - 'v*' # Dispara apenas quando você cria uma tag como v1.0.0, v0.1.0, etc.

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: folio-windows.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: folio-mac-intel
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: folio-linux

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Linux Dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev libsoup2.4-dev

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Build Binary
      run: cargo build --release --target ${{ matrix.target }}

    - name: Prepare Windows Artifact
      if: matrix.os == 'windows-latest'
      run: cp target/${{ matrix.target }}/release/folio.exe ./folio-windows.exe

    - name: Prepare Unix Artifacts
      if: matrix.os != 'windows-latest'
      run: cp target/${{ matrix.target }}/release/folio ./${{ matrix.artifact_name }}

    - name: Upload Artifact to Workflow
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.artifact_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permissão obrigatória para criar o Release
    steps:
    - name: Download Windows Artifact
      uses: actions/download-artifact@v4
      with:
        name: folio-windows.exe

    - name: Download Mac Artifact
      uses: actions/download-artifact@v4
      with:
        name: folio-mac-intel

    - name: Download Linux Artifact
      uses: actions/download-artifact@v4
      with:
        name: folio-linux

    - name: Publish Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          folio-windows.exe
          folio-mac-intel
          folio-linux
        body: "Release automática gerada pelo GitHub Actions."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
