name: Build and Pack Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # permite rodar manualmente pela aba Actions (sem criar release)

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-pack:
    name: Pack for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            format: nsis
          - name: macos-intel
            os: macos-15-intel # macos-13 foi desativado pelo GitHub
            format: dmg
          - name: linux
            os: ubuntu-24.04
            format: appimage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgtk-3-dev libfuse2t64 file

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build binary
        run: cargo build --release

      - name: Package
        env:
          # linuxdeploy/appimagetool rodam sem precisar de FUSE no runner
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: cargo packager --release --formats ${{ matrix.format }}

      - name: List packages
        shell: bash
        run: ls -la dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: folio-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build-and-pack
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body: "Release oficial contendo instaladores nativos DMG (Mac Intel), AppImage (Linux) e instalador Windows."
